name: Build APK

on:
  push:
  workflow_dispatch:

# Publishing a release needs write access to the repo's contents.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # GITHUB_RUN_NUMBER becomes the versionCode, so every build installs
      # over the last one as an update.
      - name: Test and build the release APK
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Name the APK after its version
        id: apk
        run: |
          version="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/workouts-${version}.apk"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "path=dist/workouts-${version}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: workouts-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.path }}

      # The UI test drives every screen and saves a PNG of each.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore

      # A release per build is the easy way onto the phone: open the repo's
      # Releases page in the phone's browser and tap the .apk. Builds from
      # any branch other than main are marked pre-release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          subject="$(git log -1 --pretty=%s)"
          flags=()
          if [ "$BRANCH" != "$DEFAULT_BRANCH" ]; then flags+=(--prerelease); fi
          gh release create "v${VERSION}" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Workouts ${VERSION}" \
            --notes "Built from \`${BRANCH}\` at ${GITHUB_SHA::7}: ${subject}" \
            "${flags[@]}"

      # Keep the Releases page short: the ten newest builds.
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
